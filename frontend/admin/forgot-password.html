<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password — INNO's Stationery Internal System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="mark">I</div>
      <h2 style="font-size:16px;margin-bottom:2px;">Reset your password</h2>
      <p style="font-size:12px;margin:0;">Answer your security questions to continue.</p>
    </div>

    <div id="rpAlert"></div>

    <form id="stepUsernameForm">
      <div class="field">
        <label for="rpUsername">Username or email</label>
        <input type="text" id="rpUsername" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Continue</button>
    </form>

    <form id="stepAnswersForm" style="display:none;">
      <div class="field">
        <label id="q1Label"></label>
        <input type="text" id="answer1" required>
      </div>
      <div class="field">
        <label id="q2Label"></label>
        <input type="text" id="answer2" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Verify Answers</button>
    </form>

    <form id="stepResetForm" style="display:none;">
      <div class="field">
        <label for="newPassword">New password (min 8 characters)</label>
        <input type="password" id="newPassword" required minlength="8">
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Set New Password</button>
    </form>

    <p style="text-align:center;margin-top:14px;font-size:12px;">
      <a href="login.html" style="color:var(--navy);font-weight:600;">← Back to login</a>
    </p>
  </div>
</div>

<script src="admin-core.js"></script>
<script>
addPasswordToggle(document.getElementById('newPassword'));
addPasswordToggle(document.getElementById('confirmPassword'));

const API = '../../backend/api/password_reset.php';
let currentUsername = '';
let resetToken = '';

function showAlert(msg, type = 'error') {
    document.getElementById('rpAlert').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

document.getElementById('stepUsernameForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('rpAlert').innerHTML = '';
    currentUsername = document.getElementById('rpUsername').value.trim();

    const res = await fetch(API + '?action=get_questions', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUsername }),
    }).then(r => r.json());

    if (!res.success) { showAlert(res.message); return; }

    document.getElementById('q1Label').textContent = res.question_1;
    document.getElementById('q2Label').textContent = res.question_2;
    document.getElementById('stepUsernameForm').style.display = 'none';
    document.getElementById('stepAnswersForm').style.display = 'block';
});

document.getElementById('stepAnswersForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('rpAlert').innerHTML = '';

    const res = await fetch(API + '?action=verify_answers', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: currentUsername,
            answer_1: document.getElementById('answer1').value,
            answer_2: document.getElementById('answer2').value,
        }),
    }).then(r => r.json());

    if (!res.success) { showAlert(res.message); return; }

    resetToken = res.token;
    document.getElementById('stepAnswersForm').style.display = 'none';
    document.getElementById('stepResetForm').style.display = 'block';
});

document.getElementById('stepResetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('rpAlert').innerHTML = '';

    const pw = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    if (pw !== confirm) { showAlert('Passwords do not match.'); return; }

    const res = await fetch(API + '?action=reset_password', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: resetToken, new_password: pw }),
    }).then(r => r.json());

    if (!res.success) { showAlert(res.message); return; }

    showAlert('Password reset! Redirecting to login…', 'success');
    setTimeout(() => window.location.href = 'login.html', 1500);
});
</script>
</body>
</html>
