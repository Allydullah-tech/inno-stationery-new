<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sales — INNO's Stationery Internal System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-v3.css">
</head>
<body class="admin-body">
<div class="admin-shell">
  <div id="adminSidebarWrap"></div>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-content">

      <div class="v3-tabs">
        <button class="v3-tab active" data-tab="pos">+ New sale</button>
        <button class="v3-tab" data-tab="history">Sales history</button>
      </div>

      <!-- ================= POINT OF SALE ================= -->
      <section class="v3-panel active" id="panel-pos">
        <div id="editBanner"></div>
        <div class="v3-pos">
          <div class="panel">
            <div class="panel-head">
              <h3>Pick items</h3>
              <div class="filter-row">
                <div class="item-type-toggle" id="kindToggle"><button type="button" class="active" data-kind="product">Products</button><button type="button" data-kind="service">Services</button></div>
                <div class="search-input-wrap" style="min-width:190px;">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
                  <input type="text" id="pickSearch" placeholder="Search…" autocomplete="off">
                </div>
              </div>
            </div>
            <div class="panel-body" style="padding:14px;"><div class="v3-pick" id="pickGrid"></div></div>
          </div>

          <div class="panel v3-cart">
            <div class="panel-head"><h3>Receipt <span class="v3-chip info" id="cartCount">0</span></h3><button class="btn btn-ghost btn-sm" id="clearCart" type="button">Clear</button></div>
            <div class="panel-body" style="padding:14px;">
              <div class="v3-cart-lines" id="cartLines"></div>
              <div class="v3-carttotal"><span>Total</span><span class="t" id="cartTotal">0</span></div>

              <div style="margin-top:14px;" class="sale-type-toggle" id="saleTypeToggle"><button type="button" class="active" data-type="cash">Cash sale</button><button type="button" data-type="credit">On credit</button></div>

              <div id="cashBox">
                <div class="v3-pay" id="payButtons">
                  <button type="button" class="active" data-m="cash_in_hand">Cash in hand</button><button type="button" data-m="mpesa">M-PESA</button>
                  <button type="button" data-m="airtel_money">Airtel Money</button><button type="button" data-m="halopesa">HaloPesa</button><button type="button" data-m="mixx_by_yas">Mixx by Yas</button>
                </div>
                <div id="changeBox">
                  <div class="field-row"><div class="field"><label for="received">Cash received (TSh)</label><input type="number" id="received" min="0" placeholder="optional"></div>
                    <div class="field"><label>Change to give</label><div class="v3-money" id="changeDue" style="padding:10px 0;font-weight:700;">0</div></div></div>
                  <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px;" id="keepChangeWrap" class="v3-hidden"><input type="checkbox" id="keepChange"> Customer leaves the change with us</label>
                </div>
              </div>

              <div id="creditBox" class="v3-hidden">
                <div class="field"><label for="deadline">Pay by *</label><input type="date" id="deadline"></div>
                <div class="field"><label for="creditNotes">Credit note</label><input type="text" id="creditNotes" maxlength="255" placeholder="Agreement, guarantor…"></div>
              </div>

              <div class="field-row">
                <div class="field"><label for="custName">Customer <span id="custReq" class="v3-muted">(optional)</span></label><input type="text" id="custName" maxlength="150" placeholder="Name"></div>
                <div class="field"><label for="custPhone">Phone</label><input type="tel" id="custPhone" maxlength="40" placeholder="07xx xxx xxx"></div>
              </div>
              <div id="custInfo"></div>
              <div class="field-row">
                <div class="field"><label for="saleDate">Date</label><input type="date" id="saleDate"></div>
                <div class="field"><label for="saleNotes">Note</label><input type="text" id="saleNotes" maxlength="255"></div>
              </div>
              <div id="saleAlert"></div>
              <button class="btn btn-primary btn-block" id="completeBtn" type="button">Complete sale</button>
              <button class="btn btn-outline btn-block v3-hidden" id="cancelEditBtn" type="button" style="margin-top:8px;">Cancel editing</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ================= HISTORY ================= -->
      <section class="v3-panel" id="panel-history">
        <div class="v3-stats" id="histStats"></div>
        <div class="panel">
          <div class="panel-head">
            <h3>Sales history</h3>
            <div class="filter-row">
              <input type="date" id="hFrom"><input type="date" id="hTo">
              <select id="hType" style="padding:9px 11px;border:1.5px solid var(--line-soft);border-radius:10px;background:#fff;"><option value="">All sales</option><option value="cash">Cash</option><option value="credit">Credit</option></select>
              <input type="text" id="hSearch" placeholder="Item, receipt, customer…" style="padding:9px 11px;border:1.5px solid var(--line-soft);border-radius:10px;">
              <button class="btn btn-outline btn-sm" id="hGo">Filter</button>
            </div>
          </div>
          <div class="panel-body table-wrap">
            <table class="data-table">
              <thead><tr><th>Date</th><th>Receipt</th><th>Items</th><th>Customer</th><th>Payment</th><th>Total</th><th>By</th><th></th></tr></thead>
              <tbody id="histRows"><tr><td colspan="8" class="text-center" style="padding:30px;">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<div class="modal-backdrop" id="doneModal"><div class="modal" style="max-width:420px;text-align:center;">
  <div class="modal-body" style="padding:30px 24px;">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--emerald-tint);color:var(--emerald);display:grid;place-items:center;margin:0 auto 12px;animation:v3Pop .5s both;">✓</div>
    <h3 style="margin:0 0 4px;" id="doneTitle">Sale recorded</h3>
    <p class="v3-muted" id="doneSub"></p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
      <a class="btn btn-primary" id="doneReceipt" href="#">View receipt</a>
      <button class="btn btn-outline" onclick="adminCloseModal('doneModal')">New sale</button>
    </div>
  </div>
</div></div>

<script src="admin-core.js"></script>
<script src="admin-sales.js"></script>
</body>
</html>
