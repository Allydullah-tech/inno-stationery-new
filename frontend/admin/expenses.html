<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expenses — INNO's Stationery Internal System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-v3.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <div id="adminSidebarWrap"></div>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-content">

      <div class="form-card" style="margin-bottom:20px;max-width:640px;">
        <h3 style="font-size:14px;margin-bottom:12px;">Record an expense</h3>
        <form id="expenseForm">
          <div class="field">
            <label for="expDescription">Description *</label>
            <input type="text" id="expDescription" placeholder="e.g. electricity bill, transport" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="expCategory">Category</label>
              <input type="text" id="expCategory" placeholder="e.g. utilities, transport, rent">
            </div>
            <div class="field">
              <label for="expAmount">Amount (TSh) *</label>
              <input type="number" id="expAmount" min="0" required>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="expDate">Date</label>
              <input type="date" id="expDate">
            </div>
            <div class="field">
              <label for="expPaid">Paid from</label>
              <select id="expPaid"><option value="cash">Cash from the till</option><option value="online">Mobile money</option><option value="other">Bank / other (not the till)</option></select>
            </div>
          </div>
          <div id="expenseAlert"></div>
          <button type="submit" class="btn btn-primary" id="expenseSaveBtn">Record Expense</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Expense history</h3>
          <div class="filter-row">
            <div class="search-input-wrap" style="min-width:180px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
              <input type="text" id="expSearch" placeholder="Search description or category…" autocomplete="off">
            </div>
            <input type="date" id="filterFrom">
            <input type="date" id="filterTo">
            <button class="btn btn-outline btn-sm" id="filterBtn">Filter</button>
          </div>
        </div>
        <div class="panel-body table-wrap">
          <table class="data-table">
            <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Paid from</th><th>Recorded By</th><th></th></tr></thead>
            <tbody id="expensesTbody"><tr><td colspan="7" style="text-align:center;padding:30px;">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-backdrop" id="expModal"><div class="modal">
  <div class="modal-head"><h3>Edit expense</h3><button class="modal-close" onclick="adminCloseModal('expModal')">&times;</button></div>
  <div class="modal-body">
    <input type="hidden" id="eId">
    <div class="field"><label>Description</label><input type="text" id="eDesc" maxlength="255"></div>
    <div class="field-row"><div class="field"><label>Category</label><input type="text" id="eCat" maxlength="80"></div><div class="field"><label>Amount (TSh)</label><input type="number" id="eAmt" min="1"></div></div>
    <div class="field-row"><div class="field"><label>Date</label><input type="date" id="eDate"></div><div class="field"><label>Paid from</label><select id="ePaid"><option value="cash">Cash</option><option value="online">Mobile money</option><option value="other">Other</option></select></div></div>
    <div id="eAlert"></div><button class="btn btn-primary" id="eSave">Save changes</button>
  </div>
</div></div>

<script src="admin-core.js"></script>
<script src="admin-expenses.js"></script>
</body>
</html>
