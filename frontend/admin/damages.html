<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Damages — INNO's Stationery Internal System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/admin-v3.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <div id="adminSidebarWrap"></div>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-content">

      <div class="form-card" style="margin-bottom:20px;max-width:640px;">
        <h3 style="font-size:14px;margin-bottom:12px;">Record a loss</h3>
        <form id="damageForm">

          <div class="field">
            <label>What kind of item is this? *</label>
            <div class="radio-cards item-type-toggle">
              <label class="radio-card"><input type="radio" name="stockScope" value="stock" checked><span>📦 Stock Item</span></label>
              <label class="radio-card"><input type="radio" name="stockScope" value="non_stock"><span>🧰 Non-Stock Item</span></label>
            </div>
            <div class="hint">Non-stock items (equipment, tools, office assets, etc.) were never registered in Stock and won't affect product inventory.</div>
          </div>

          <div class="field-row" id="stockItemWrap">
            <div class="field">
              <label for="dmgProductSearch">Product *</label>
              <div class="product-search-wrap">
                <input type="text" id="dmgProductSearch" placeholder="Type to search products…" autocomplete="off">
                <div class="product-search-suggestions" id="dmgProductSuggestions"></div>
              </div>
              <div class="hint" id="dmgStockHint"></div>
            </div>
            <div class="field">
              <label for="dmgQty">Quantity *</label>
              <input type="number" id="dmgQty" min="1" value="1">
            </div>
          </div>

          <div id="nonStockItemWrap" style="display:none;">
            <div class="field-row">
              <div class="field">
                <label for="dmgItemName">Item name *</label>
                <input type="text" id="dmgItemName" placeholder="e.g. Barcode scanner">
              </div>
              <div class="field">
                <label for="dmgItemQty">Quantity *</label>
                <input type="number" id="dmgItemQty" min="1" value="1">
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="dmgCategory">Category / type (optional)</label>
                <input type="text" id="dmgCategory" placeholder="e.g. Equipment, Electronics, Furniture">
              </div>
              <div class="field">
                <label for="dmgItemValue">Estimated / actual value per unit (TSh) *</label>
                <input type="number" id="dmgItemValue" min="0">
              </div>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label>Reason *</label>
              <div class="radio-cards">
                <label class="radio-card"><input type="radio" name="dmgReason" value="expired" checked><span>Expired</span></label>
                <label class="radio-card"><input type="radio" name="dmgReason" value="damaged"><span>Damaged</span></label>
                <label class="radio-card"><input type="radio" name="dmgReason" value="other"><span>Other</span></label>
              </div>
            </div>
            <div class="field">
              <label for="dmgDate">Date</label>
              <input type="date" id="dmgDate">
            </div>
          </div>
          <div class="field">
            <label for="dmgNotes">Notes (optional)</label>
            <input type="text" id="dmgNotes" placeholder="e.g. water damage during storage">
          </div>
          <div id="damageAlert"></div>
          <button type="submit" class="btn btn-primary" id="damageSaveBtn">Record</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Damage &amp; loss history</h3>
          <div class="filter-row">
            <div class="search-input-wrap" style="min-width:180px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
              <input type="text" id="dmgSearch" placeholder="Search item or category…" autocomplete="off">
            </div>
            <select id="filterScope">
              <option value="">All items</option>
              <option value="stock">Stock items only</option>
              <option value="non_stock">Non-stock items only</option>
            </select>
            <input type="date" id="filterFrom">
            <input type="date" id="filterTo">
            <button class="btn btn-outline btn-sm" id="filterBtn">Filter</button>
          </div>
        </div>
        <div class="panel-body table-wrap">
          <table class="data-table">
            <thead><tr><th>Date</th><th>Item</th><th>Source</th><th>Category</th><th>Qty</th><th>Reason</th><th>Loss</th><th>Recorded By</th><th></th></tr></thead>
            <tbody id="damagesTbody"><tr><td colspan="9" style="text-align:center;padding:30px;">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="admin-core.js"></script>
<script src="admin-damages.js"></script>
</body>
</html>
