<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Services — INNO's Stationery Internal System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <div id="adminSidebarWrap"></div>
  <div class="admin-main">
    <div class="admin-topbar" id="adminTopbar"></div>
    <div class="admin-content">

      <div class="summary-grid" id="serviceSummaryGrid">
        <div class="skeleton" style="height:76px;"></div>
        <div class="skeleton" style="height:76px;"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>All services</h3>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <div class="search-input-wrap" style="min-width:220px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.5" y2="15.5"/></svg>
              <input type="text" id="serviceSearch" placeholder="Search services…" autocomplete="off">
            </div>
            <select id="filterServiceStatus" class="status-select">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
            <button class="btn btn-primary btn-sm" id="newServiceBtn">+ Add Service</button>
          </div>
        </div>
        <div class="panel-body table-wrap">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Code</th><th>Selling Price</th><th>Buying Cost</th><th>Status</th><th>Date Added</th><th></th></tr></thead>
            <tbody id="servicesTbody">
              <tr><td colspan="7" style="text-align:center;padding:30px;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Service form modal -->
<div class="modal-backdrop" id="serviceModalBackdrop">
  <div class="modal" style="max-width:520px;">
    <div class="modal-head">
      <h3 id="serviceModalTitle">Add Service</h3>
      <button class="modal-close" id="serviceModalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="serviceForm">
        <input type="hidden" id="sf_id">
        <div class="field">
          <label for="sf_name">Service name *</label>
          <input type="text" id="sf_name" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="sf_code">Service code / reference (optional)</label>
            <input type="text" id="sf_code" placeholder="e.g. SVC-PRINT">
          </div>
          <div class="field">
            <label for="sf_status">Status</label>
            <select id="sf_status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="sf_description">Description</label>
          <textarea id="sf_description" placeholder="What this service covers…"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="sf_selling_price">Selling price (TSh) *</label>
            <input type="number" id="sf_selling_price" min="0" step="1" required>
          </div>
          <div class="field">
            <label for="sf_buying_cost">Buying cost (optional)</label>
            <input type="number" id="sf_buying_cost" min="0" step="1" placeholder="Leave blank if unknown">
            <div class="hint">Leave blank if this service has no measurable acquisition cost — reports will show it as "not provided" rather than assuming zero.</div>
          </div>
        </div>
        <div id="serviceFormAlert"></div>
        <button type="submit" class="btn btn-primary btn-block" id="serviceSaveBtn">Save Service</button>
      </form>
    </div>
  </div>
</div>

<script src="admin-core.js"></script>
<script src="admin-services.js"></script>
</body>
</html>
